<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>My AI Companion</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #090a10;
            color: white;
            font-family: Arial, sans-serif;
        }

        #app {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #scene {
            position: absolute;
            inset: 0;
        }

        #status {
            position: absolute;
            top: 18px;
            left: 18px;
            padding: 8px 12px;
            border-radius: 20px;
            background: rgba(0,0,0,.45);
            backdrop-filter: blur(10px);
            font-size: 13px;
            color: #ddd;
            z-index: 5;
        }

        #chat {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 18px;
            background: linear-gradient(
                transparent,
                rgba(5,6,12,.92) 30%
            );
            padding-top: 80px;
            z-index: 5;
        }

        #message {
            margin-bottom: 12px;
            font-size: 18px;
            text-shadow: 0 2px 5px black;
        }

        #inputRow {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            min-width: 0;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 18px;
            padding: 13px 16px;
            background: rgba(255,255,255,.1);
            color: white;
            outline: none;
            font-size: 16px;
        }

        button {
            border: 0;
            border-radius: 18px;
            padding: 0 18px;
            background: rgba(255,255,255,.15);
            color: white;
            font-size: 15px;
        }

        button:active {
            transform: scale(.94);
            background: rgba(255,255,255,.25);
        }
    </style>
</head>

<body>

<div id="app">

    <div id="scene"></div>

    <div id="status">
        ● Companion online
    </div>

    <div id="chat">

        <div id="message">
            Hey. I'm waiting for you.
        </div>

        <div id="inputRow">
            <input
                id="userInput"
                type="text"
                placeholder="Say something..."
                autocomplete="off"
            >

            <button id="sendButton">
                Send
            </button>
        </div>

    </div>

</div>

<script type="module">

    import * as THREE from
        'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    // -------------------------
    // Scene
    // -------------------------

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x090a10);

    // -------------------------
    // Camera
    // -------------------------

    const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100
    );

    camera.position.set(0, 1.3, 4);

    // -------------------------
    // Renderer
    // -------------------------

    const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    document
        .getElementById("scene")
        .appendChild(renderer.domElement);

    // -------------------------
    // Lighting
    // -------------------------

    const ambient = new THREE.HemisphereLight(
        0xffffff,
        0x202030,
        2
    );

    scene.add(ambient);

    const light = new THREE.DirectionalLight(
        0xffffff,
        2
    );

    light.position.set(2, 4, 3);

    scene.add(light);

    // -------------------------
    // Temporary character
    // -------------------------

    const character = new THREE.Group();

    scene.add(character);

    // Body

    const bodyGeometry =
        new THREE.CapsuleGeometry(
            0.55,
            1.2,
            8,
            16
        );

    const bodyMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x704060,
            roughness: 0.65
        });

    const body =
        new THREE.Mesh(
            bodyGeometry,
            bodyMaterial
        );

    body.position.y = 0.8;

    character.add(body);

    // Head

    const headGeometry =
        new THREE.SphereGeometry(
            0.55,
            32,
            32
        );

    const skinMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xffc6b0,
            roughness: 0.55
        });

    const head =
        new THREE.Mesh(
            headGeometry,
            skinMaterial
        );

    head.scale.set(
        0.92,
        1.08,
        0.9
    );

    head.position.y = 1.95;

    character.add(head);

    // Eyes

    const eyeGeometry =
        new THREE.SphereGeometry(
            0.075,
            16,
            16
        );

    const eyeMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x151525
        });

    const leftEye =
        new THREE.Mesh(
            eyeGeometry,
            eyeMaterial
        );

    const rightEye =
        new THREE.Mesh(
            eyeGeometry,
            eyeMaterial
        );

    leftEye.position.set(
        -0.19,
        2.02,
        0.48
    );

    rightEye.position.set(
        0.19,
        2.02,
        0.48
    );

    character.add(leftEye);
    character.add(rightEye);

    // -------------------------
    // Interaction
    // -------------------------

    const message =
        document.getElementById("message");

    const input =
        document.getElementById("userInput");

    const send =
        document.getElementById("sendButton");

    function respond() {

        const text =
            input.value.trim();

        if (!text) return;

        message.textContent =
            "You said: " + text;

        input.value = "";

        // Little reaction

        character.rotation.y += 0.15;
    }

    send.addEventListener(
        "click",
        respond
    );

    input.addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                respond();
            }

        }
    );

    // -------------------------
    // Touch reaction
    // -------------------------

    renderer.domElement.addEventListener(
        "pointerdown",
        () => {

            message.textContent =
                "You touched me.";

            character.rotation.y += 0.2;

        }
    );

    // -------------------------
    // Animation
    // -------------------------

    const clock =
        new THREE.Clock();

    function animate() {

        requestAnimationFrame(
            animate
        );

        const time =
            clock.getElapsedTime();

        // Gentle breathing

        character.position.y =
            Math.sin(time * 1.5) * 0.025;

        // Gentle head movement

        head.rotation.y =
            Math.sin(time * 0.7) * 0.04;

        renderer.render(
            scene,
            camera
        );
    }

    animate();

    // -------------------------
    // Resize
    // -------------------------

    window.addEventListener(
        "resize",
        () => {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }
    );

</script>

</body>
</html>
